# Copy to .github/workflows/ci.yml in DRADIS (replaces docs.yml).
# Needs docs/.nvmrc (the shared workflow reads Node from it; DRADIS currently hardcodes 22).
# Replace @main with a tag or commit SHA of gh-as-code once you cut one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: posidon16/gh-as-code/.github/workflows/docs-site.yml@main

  hygiene:
    uses: posidon16/gh-as-code/.github/workflows/repo-hygiene.yml@main

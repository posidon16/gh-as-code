# Copy to .github/workflows/ci.yml in the consuming repo.
# Replace @main with a tag or commit SHA of gh-as-code once you cut one; Dependabot
# (github-actions ecosystem) will then propose bumps.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: posidon16/gh-as-code/.github/workflows/docs-site.yml@main
    with:
      # AGENTS.md section 3: agents read the docs through these, so a build that drops them must fail.
      required-outputs: |
        out/llms.txt
        out/llms-full.txt
        out/api/search
        out/llms.mdx/docs/status/content.md

  hygiene:
    uses: posidon16/gh-as-code/.github/workflows/repo-hygiene.yml@main
    with:
      docs-sections-dir: docs/content/docs

  # Repo-specific job stays local.
  bench:
    name: Bench scripts (syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m py_compile bench/*.py
      - run: python -I bench/llm_latency.py --help > /dev/null
